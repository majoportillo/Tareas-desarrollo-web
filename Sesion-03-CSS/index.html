<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos — Tarea CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="container">
        <h1>Galería de Productos</h1>

        <!-- TODO: Galería de productos
             Cada tarjeta debe contener:
             - Imagen del producto (usa placeholder o imágenes de ejemplo)
             - Nombre del producto
             - Precio
             - Botón con texto "Comprar"
             
             Desktop (>=1024px): 3 columnas
             Mobile (<768px): 1 columna con scroll vertical
        -->
        <section class="galeria">

            <article class="producto">
                <img src="https://i.pinimg.com/736x/4e/96/e8/4e96e8adcff42a066d8b6fa71900fae6.jpg" alt="Blusa Negra">
                <div class="producto-info">
                    <h2>Blusa Negra</h2>
                    <p class="precio">Q99.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://i.pinimg.com/736x/b9/f3/cf/b9f3cf75a5dfc4146285e64e7e9db6c4.jpg" alt="Bolso Marrón a la moda">
                <div class="producto-info">
                    <h2>Bolso Marrón a la moda</h2>
                    <p class="precio">Q149.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://i.pinimg.com/1200x/da/95/9a/da959a6ae0d938f935ca695a44699855.jpg" alt="Chaqueta Café">
                <div class="producto-info">
                    <h2>Chaqueta Café</h2>
                    <p class="precio">Q199.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://i.pinimg.com/736x/58/23/34/58233431be7c09e9090fa503bda8de64.jpg" alt="Chaqueta adidas azul">
                <div class="producto-info">
                    <h2>Chaqueta adidas azul</h2>
                    <p class="precio">Q79.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://i.pinimg.com/736x/ef/fa/96/effa960f41d4e20b7a0e31253732d75e.jpg" alt="Gorra Azul">
                <div class="producto-info">
                    <h2>Gorra Azul</h2>
                    <p class="precio">Q249.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

            <article class="producto">
                <img src="https://i.pinimg.com/736x/45/ed/05/45ed055d3a130a8e3d8c6328868e5f96.jpg" alt="Gafas sencillas">
                <div class="producto-info">
                    <h2>Gafas sencillas</h2>
                    <p class="precio">Q299.99</p>
                    <button class="btn-comprar">Comprar</button>
                </div>
            </article>

        </section>

        <h2>To-Do List</h2>

        <!-- TODO: Layout de Todo List
             Lista de tareas estilizada con:
             - Checkbox para marcar completado
             - Texto de la tarea
             - Diseño limpio y accesible
        -->
        <section class="todo-list">
            <ul class="tareas" role="list">
                <li class="tarea">
                    <input type="checkbox" id="t1">
                    <label for="t1">Aprender CSS Grid</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t2">
                    <label for="t2">Practicar Flexbox</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t3">
                    <label for="t3">Estudiar diseño responsivo</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t4">
                    <label for="t4">Hacer la tarea de CSS</label>
                </li>
                <li class="tarea">
                    <input type="checkbox" id="t5">
                    <label for="t5">Revisar novedades de CSS 2024</label>
                </li>
            </ul>
        </section>
    </main>

</body>
</html>
