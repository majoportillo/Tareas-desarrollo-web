<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Reseñas Literarias</h1>
    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="resenas.html">Reseñas</a></li>
        <li><a href="BookTips.html">BookTips & Más</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article>
      <h2>Escríbeme</h2>
      <p>
        ¿Tenés una recomendación de libro o querés colaborar? Dejame tu
        mensaje por acá.
      </p>

      <form>
        <div>
          <label for="nombre">Nombre</label><br>
          <input type="text" id="nombre" name="nombre" required minlength="2" placeholder="Tu nombre">
        </div>

        <div>
          <label for="correo">Correo</label><br>
          <input type="email" id="correo" name="correo" required placeholder="tucorreo@ejemplo.com">
        </div>

        <div>
          <label for="mensaje">Mensaje</label><br>
          <textarea id="mensaje" name="mensaje" rows="4" required minlength="10" placeholder="Escribe tu mensaje..."></textarea>
        </div>

        <button type="submit" class="btn">Enviar mensaje</button>
      </form>
    </article>

    <section>
      <h2>Sígueme</h2>
      <p>
        También podés encontrarme en
        <a href="https://www.tiktok.com" target="_blank" rel="noopener">TikTok</a>
        compartiendo lecturas.
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Reseñas Literarias · Hecho con HTML semántico</p>
  </footer>

</body>
</html>
